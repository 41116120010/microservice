spring.application.name=AUTH-SERVICE
server.port=9300

spring.datasource.url=jdbc:h2:~/auth-service;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

app.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:9300}
app.jwt.expiration-minutes=${AUTH_JWT_EXPIRATION_MINUTES:30}
app.bootstrap-admin.username=${AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
