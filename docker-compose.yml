name: microservice

x-logging-environment: &logging-environment
  LOGSTASH_HOST: logstash
  LOGSTASH_PORT: 5000

services:
  rabbitmq:
    mem_limit: 160m
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    volumes:
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka:
    mem_limit: 320m
    build:
      context: .
      args:
        SERVICE_DIR: eureka
    ports:
      - "8761:8761"
    environment:
      <<: *logging-environment

  auth-service:
    mem_limit: 352m
    build:
      context: .
      args:
        SERVICE_DIR: auth-service
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: auth-service
      AUTH_JWT_ISSUER: http://auth-service:9300
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@local.test}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set AUTH_BOOTSTRAP_ADMIN_PASSWORD in your shell or .env file}
    volumes:
      - auth-data:/root
    depends_on:
      - eureka

  produk:
    mem_limit: 320m
    build:
      context: .
      args:
        SERVICE_DIR: Produk
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: produk
      AUTH_JWK_SET_URI: http://auth-service:9300/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9300
    volumes:
      - produk-data:/root
    depends_on:
      - eureka
      - auth-service

  order:
    mem_limit: 352m
    build:
      context: .
      args:
        SERVICE_DIR: Order
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order
      AUTH_JWK_SET_URI: http://auth-service:9300/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9300
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
      auth-service:
        condition: service_started

  pelanggan:
    mem_limit: 320m
    build:
      context: .
      args:
        SERVICE_DIR: Pelanggan
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: pelanggan
      AUTH_JWK_SET_URI: http://auth-service:9300/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9300
    depends_on:
      - eureka
      - auth-service

  produser:
    mem_limit: 288m
    build:
      context: .
      args:
        SERVICE_DIR: produser
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: produser
      AUTH_JWK_SET_URI: http://auth-service:9300/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9300
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
      auth-service:
        condition: service_started

  konsumer:
    profiles: ["notifications"]
    mem_limit: 288m
    build:
      context: .
      args:
        SERVICE_DIR: konsumer
    environment:
      <<: *logging-environment
      RABBITMQ_HOST: rabbitmq
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    mem_limit: 352m
    build:
      context: .
      args:
        SERVICE_DIR: gateway
    ports:
      - "9310:9310"
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: gateway
      AUTH_JWK_SET_URI: http://auth-service:9300/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9300
    depends_on:
      - eureka
      - auth-service
      - produk
      - order
      - pelanggan
      - produser

  prometheus:
    mem_limit: 192m
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    mem_limit: 192m
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: daffiq
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your shell or .env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  elasticsearch:
    mem_limit: 768m
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 90%
      cluster.routing.allocation.disk.watermark.high: 95%
      cluster.routing.allocation.disk.watermark.flood_stage: 97%
      ES_JAVA_OPTS: -Xms320m -Xmx320m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  logstash:
    mem_limit: 512m
    image: docker.elastic.co/logstash/logstash:8.15.0
    environment:
      LS_JAVA_OPTS: -Xms128m -Xmx128m
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch

  kibana:
    mem_limit: 640m
    image: docker.elastic.co/kibana/kibana:8.15.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      - elasticsearch

volumes:
  auth-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  produk-data:
