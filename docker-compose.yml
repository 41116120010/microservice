name: microservice-learning

x-logging-environment: &logging-environment
  LOGSTASH_HOST: logstash
  LOGSTASH_PORT: 5000

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    volumes:
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka:
    build:
      context: .
      args:
        SERVICE_DIR: eureka
    ports:
      - "8761:8761"
    environment:
      <<: *logging-environment

  auth-service:
    build:
      context: .
      args:
        SERVICE_DIR: auth-service
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      AUTH_JWT_ISSUER: http://auth-service:9000
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set AUTH_BOOTSTRAP_ADMIN_PASSWORD in your shell or .env file}
    depends_on:
      - eureka

  produk:
    build:
      context: .
      args:
        SERVICE_DIR: Produk
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-service:9000/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9000
    depends_on:
      - eureka
      - auth-service

  order:
    build:
      context: .
      args:
        SERVICE_DIR: Order
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-service:9000/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9000
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
      auth-service:
        condition: service_started

  pelanggan:
    build:
      context: .
      args:
        SERVICE_DIR: Pelanggan
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-service:9000/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9000
    depends_on:
      - eureka
      - auth-service

  produser:
    build:
      context: .
      args:
        SERVICE_DIR: produser
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-service:9000/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9000
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
      auth-service:
        condition: service_started

  konsumer:
    profiles: ["notifications"]
    build:
      context: .
      args:
        SERVICE_DIR: konsumer
    environment:
      <<: *logging-environment
      RABBITMQ_HOST: rabbitmq
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      args:
        SERVICE_DIR: gateway
    ports:
      - "9310:9310"
    environment:
      <<: *logging-environment
      EUREKA_URL: http://eureka:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-service:9000/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:9000
    depends_on:
      - eureka
      - auth-service
      - produk
      - order
      - pelanggan
      - produser

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your shell or .env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
