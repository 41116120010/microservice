server.port=9310

spring.application.name=gateway
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=produk-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PRODUK
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/produk/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ORDER
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/order/**

spring.cloud.gateway.server.webmvc.routes[3].id=pelanggan-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PELANGGAN
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/pelanggan/**

spring.cloud.gateway.server.webmvc.routes[4].id=produser-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PRODUSER
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/send

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9300/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_JWT_ISSUER:http://localhost:9300}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
